# Puerto HTTP del servicio web. Se usa 9090 porque en Windows el rango 8003-8102
# (incluido 8080) suele quedar reservado por Hyper-V/Docker. Se cambia con la variable PORT.
server.port=${PORT:9090}

# Base de datos H2 en archivo local (carpeta ./data). No requiere instalar un motor.
# Para usar MySQL ejecute con el perfil "mysql" (ver application-mysql.properties).
spring.datasource.url=jdbc:h2:file:./data/libreria_luz_db;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Crea o actualiza las tablas a partir de las entidades.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Consola web de H2 deshabilitada por defecto.
spring.h2.console.enabled=false

# Documentación de los servicios (Swagger UI / OpenAPI).
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
